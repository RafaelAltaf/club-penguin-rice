[accessibility]
ui_scale = 1.2

[bar.default]
capsule_group = []
capsule_thickness = 0.64999998919665813
center = [ "clock" ]
concave_edge_corners = true
end = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "battery", "session" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.1000000000000001
start = [ "workspaces", "active_window" ]
thickness = 30

[calendar]
enabled = true

[control_center.media]
show_visualizer = false

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 144.0
    box_width = 304.0
    cx = 1187.0
    cy = 672.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        album_art_background = false
        album_art_blur = 32
        audio_visualizer = true
        background = true
        background_color = "surface_container_highest"
        background_opacity = 0.75
        background_padding = 8
        background_radius = 12
        color = "on_tertiary_container"
        hide_when_no_media = false
        layout = "vertical"
        shadow = true

[dock]
auto_hide = true
cross_axis_padding = 5
enabled = true
icon_size = 40
item_spacing = 5
launcher_icon = "layout-grid-filled"
magnification_scale = 1.2500000037252903
main_axis_padding = 10
margin_edge = 5
pinned = [
    "brave-browser",
    "thunar",
    "kitty",
    "code-oss",
    "dev.zed.Zed",
    "io.dbeaver.DBeaver",
    "spotify-launcher",
    "steam",
    "discord"
]
reserve_space = false
show_dots = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
media = false

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[wallpaper]
directory = "/home/altafito/Documentos/club-penguin-rice/assets/wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/altafito/Documentos/club-penguin-rice/assets/wallpapers/cpcoffee.png"

    [wallpaper.last]
    path = "/home/altafito/Documentos/club-penguin-rice/assets/wallpapers/cpcoffee.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/altafito/Documentos/club-penguin-rice/assets/wallpapers/cpcoffee.png"

[widget.active_window]
anchor = true
display = "icon_only"
icon_size = 20

[widget.battery]
show_label = false

[widget.clock]
capsule = false
capsule_radius = "auto"
color = "on_primary_container"
format = "{:%H:%M %A, %d de %B}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_artist = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"
show_label = false

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.temp]
show_value = false

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"
show_label = false

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80000000000000004
show_labels = false
